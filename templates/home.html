<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RP Flask REST API</title>
</head>
<body>
    <h1>
        Trail Service!
    </h1>
    {% for Trail in trails %}
        <h2>{{ Trail.TrailName }} {{ Trail.TrailLocation }}</h2>
        <ul>
            {% for Feature in Trail.Features %}
                <li>
                    {{ Feature.FeatureName }}
                </li>
            {% endfor %}
        </ul>
    {% endfor %}
</body>
</html>
