openapi: 3.0.0
info:
  title: "COMP2001"
  description: "Trail Service API"
  version: "1.0.0"

servers:
  - url: "/api"

paths:
  /login:
    post:
      summary: Login/Authenticate via API 
      description: Authenticates a user 
      operationId: auth.login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "tim@plymouth.ac.uk"
                password:
                  type: string
                  example: "COMP2001!"
      responses:
        "200":
          description: Login successful
        "401":
          description: Unauthorised
  /trails:
    get:
      summary: Get all trails
      description: Retrieves all existing trails
      operationId: routes.get_all_trails
      responses:
        "200":
          description: A list of trails
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trail'
    post:
      summary: Create a new trail
      description: Creates a new trail
      operationId: routes.create_trail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trail'   
      responses:
        "201":
          description: Trail created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trail'
  /trails/{trail_id}:
    parameters:
      - name: trail_id
        in: path
        required: true
        description: The ID of the trail
        schema:
          type: integer
    get:
      summary: Get a specific trail
      description: Retrieves a trail by ID
      operationId: routes.get_trail_by_id
      responses:
        "200":
          description: Retrieved trail details 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trail'
    put:
      summary: Update an existing trail
      description: Updates a trail based on the provided TrailID
      operationId: routes.update_trail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trail'  
      responses:
        "200":
          description: Trail updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trail'
    delete:
      summary: Delete an existing trail
      description: Deletes a trail based on the provided TrailID
      operationId: routes.delete_trail
      responses:
        "200":
          description: Trail deleted successfully
components:
  schemas:
    Trail:
      type: object
      properties:
        TrailID:
          type: integer
          description: "The unique ID of the trail"
        TrailName:
          type: string
          description: "The name of the trail"
        TrailLocation:
          type: string
          description: "Location of the trail"
        TrailSummary:
          type: string
          description: "A short summary of the trail"
        TrailDescription:
          type: string
          description: "A detailed description of the trail"
        Difficulty:
          type: string
          description: "Difficulty level of the trail"
        RouteType:
          type: string
          description: "The type of route (Loop, Out-and-Back, Point-to-Point)"
        Distance_km:
          type: number
          format: float
          description: "The length of the trail in kilometers"
        ElevationGain_m:
          type: integer
          description: "The elevation gain in meters"
        TimeEstimate_min:
          type: integer
          description: "Estimated time to complete the trail in minutes"
        OwnerID:
          type: integer
          description: "The ID of the user who owns the trail"
        Timestamp:
          type: string
          format: date-time
          description: "The timestamp when the trail was created or last updated"